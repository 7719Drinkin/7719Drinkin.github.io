name: Bootstrap Music artist archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-music-site.yml'
      - '.github/scripts/build_music_site.py'

permissions:
  contents: write

concurrency:
  group: bootstrap-music-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Create Music data model and shared site files
        run: python .github/scripts/build_music_site.py

      - name: Generate Music directory and artist pages
        run: node scripts/build-music-pages.mjs

      - name: Commit Music site
        run: |
          rm -f .github/workflows/bootstrap-music-site.yml
          rm -f .github/scripts/build_music_site.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No Music site changes were produced."
            exit 0
          fi

          git commit -m "feat: build extensible Music artist archive"
          git push origin HEAD:main
