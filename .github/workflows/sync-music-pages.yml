name: Sync generated Music pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-music-pages.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate Music pages
        run: node scripts/build-music-pages.mjs

      - name: Commit generated pages and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/sync-music-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/index.html music/artists .github/workflows/sync-music-pages.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: sync redesigned Music pages"
          git push
