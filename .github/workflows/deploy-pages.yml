name: Build and deploy 7719 Universe

on:
  pull_request:
    paths:
      - 'apps/solar-universe/**'
      - 'anime/**'
      - 'basketball/**'
      - 'games/**'
      - 'music/**'
      - 'data/**'
      - 'scripts/**'
      - 'assets/Music/**'
      - 'js/**'
      - 'css/**'
      - '*.html'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v6

      - name: Checkout main site baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Select deployment path
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "VITE_BASE_PATH=/preview/solar-universe/" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/solar-universe/" >> "$GITHUB_ENV"
          fi

      - name: Install 3D app dependencies
        working-directory: apps/solar-universe
        run: npm install --no-audit --no-fund

      - name: Build 3D app
        working-directory: apps/solar-universe
        run: npm run build

      - name: Generate Music pages
        run: |
          cp music/index.html /tmp/music-index.manual.html
          node scripts/build-music-pages.mjs
          cp /tmp/music-index.manual.html music/index.html
          node scripts/enhance-music-albums.mjs
          node scripts/enhance-music-visual-videos.mjs
          node scripts/refine-music-playlists.mjs
          node scripts/refine-music-artist-hierarchy.mjs
          node scripts/remove-music-secondary-nav.mjs
          node scripts/version-music-album-assets.mjs
          node scripts/version-music-visual-assets.mjs
          node scripts/apply-music-design-system.mjs
          node scripts/install-site-shell.mjs

      - name: Publish pull request preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          rm -rf main-site/preview/solar-universe
          mkdir -p main-site/preview/solar-universe
          cp -a apps/solar-universe/dist/. main-site/preview/solar-universe/

          cd main-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A preview/solar-universe

          if git diff --cached --quiet; then
            echo "Preview is already current."
            exit 0
          fi

          git commit -m "preview: deploy R3F Solar Universe from PR #${{ github.event.pull_request.number }}"
          git push origin HEAD:main

      - name: Upload pull request build archive
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: solar-universe-preview
          path: apps/solar-universe/dist

      - name: Assemble complete static site
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'apps'

          # Keep preview/solar-universe in the Pages artifact so open PRs remain reviewable.
          mkdir -p _site/solar-universe
          cp -a apps/solar-universe/dist/. _site/solar-universe/
          touch _site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
