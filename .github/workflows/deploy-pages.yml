name: Build and deploy 7719 Universe

on:
  pull_request:
    paths:
      - 'apps/solar-universe/**'
      - 'index.html'
      - 'css/universe-3d-entry.css'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install 3D app dependencies
        working-directory: apps/solar-universe
        run: npm install --no-audit --no-fund

      - name: Build 3D app
        working-directory: apps/solar-universe
        run: npm run build

      - name: Assemble complete static site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'apps'
          mkdir -p _site/solar-universe
          cp -a apps/solar-universe/dist/. _site/solar-universe/
          touch _site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload pull request build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: solar-universe-preview
          path: apps/solar-universe/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
