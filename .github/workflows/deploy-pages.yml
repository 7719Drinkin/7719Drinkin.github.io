name: Build and deploy 7719 Universe

on:
  pull_request:
    paths:
      - 'apps/solar-universe/**'
      - 'index.html'
      - 'css/universe-3d-entry.css'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature source
        uses: actions/checkout@v6

      - name: Checkout main site baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Select deployment path
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "VITE_BASE_PATH=/preview/solar-universe/" >> "$GITHUB_ENV"
            echo "DEPLOY_SUBDIR=preview/solar-universe" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/solar-universe/" >> "$GITHUB_ENV"
            echo "DEPLOY_SUBDIR=solar-universe" >> "$GITHUB_ENV"
          fi

      - name: Install 3D app dependencies
        working-directory: apps/solar-universe
        run: npm install --no-audit --no-fund

      - name: Build 3D app
        working-directory: apps/solar-universe
        run: npm run build

      - name: Assemble complete static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            rsync -a main-site/ _site/ \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'apps'
          else
            rsync -a ./ _site/ \
              --exclude '.git' \
              --exclude '.github' \
              --exclude '_site' \
              --exclude 'apps'
          fi

          # The legacy native-Three.js preview is intentionally removed.
          rm -rf _site/preview/solar-universe
          mkdir -p "_site/$DEPLOY_SUBDIR"
          cp -a apps/solar-universe/dist/. "_site/$DEPLOY_SUBDIR/"
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload pull request build archive
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: solar-universe-preview
          path: apps/solar-universe/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
