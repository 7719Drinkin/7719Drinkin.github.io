<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07101d">
  <meta name="description" content="7719 Universe persistent navigation shell">
  <title>7719 Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site-shell.css?v=20260814-minimized-dock-1">
  <link rel="stylesheet" href="/css/site-shell-vinyl-toggle.css?v=20260814-vinyl-chassis-3">
</head>
<body class="site-shell-page">
  <div class="site-shell-loading" data-shell-loading aria-hidden="true">
    <i></i><span>LOADING</span>
  </div>

  <iframe
    class="site-shell-frame"
    data-shell-frame
    title="7719 Universe 页面内容"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen></iframe>

  <aside class="persistent-music-player" data-persistent-player hidden aria-label="全站音乐播放器">
    <audio data-persistent-audio preload="metadata"></audio>

    <div class="persistent-player-chassis">
      <button
        class="persistent-player-collapse"
        type="button"
        data-persistent-collapse
        aria-label="收起播放器"
        aria-expanded="true">
        <span class="persistent-player-collapse-icon" data-persistent-collapse-icon aria-hidden="true"></span>
      </button>

      <div class="persistent-player-main">
        <div class="persistent-player-copy" aria-label="当前歌曲">
          <strong data-persistent-title>尚未选择歌曲</strong>
          <span class="persistent-player-copy-separator persistent-player-detail" aria-hidden="true">·</span>
          <span class="persistent-player-artist persistent-player-detail" data-persistent-artist>7719 Music</span>
          <span class="persistent-player-copy-separator persistent-player-album-separator persistent-player-detail" aria-hidden="true">·</span>
          <span class="persistent-player-album persistent-player-detail" data-persistent-album></span>
        </div>

        <div class="persistent-player-transport">
          <div class="persistent-player-progress persistent-player-secondary-control">
            <time data-persistent-current>0:00</time>
            <input class="persistent-player-range" data-persistent-seek type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度">
            <time data-persistent-duration>0:00</time>
          </div>

          <label class="persistent-player-volume-inline persistent-player-secondary-control" data-persistent-volume-control>
            <span class="persistent-player-volume-icon" data-persistent-volume-icon aria-hidden="true"></span>
            <input class="persistent-player-range" data-persistent-volume type="range" min="0" max="1" value="0.8" step="0.01" aria-label="音量">
          </label>

          <div class="persistent-player-transport-actions">
            <button class="persistent-player-skip persistent-player-secondary-action" type="button" data-persistent-prev aria-label="上一首"></button>
            <button class="persistent-player-toggle" type="button" data-persistent-toggle aria-label="播放"></button>
            <button class="persistent-player-skip persistent-player-secondary-action" type="button" data-persistent-next aria-label="下一首"></button>
            <button class="persistent-player-close persistent-player-secondary-action" type="button" data-persistent-close aria-label="停止并关闭播放器"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="persistent-player-turntable" data-persistent-turntable tabindex="-1">
      <span class="persistent-player-platter" aria-hidden="true">
        <span class="persistent-player-grooves"></span>
        <span class="persistent-player-cover" data-persistent-cover>77</span>
      </span>

      <span class="persistent-player-tonearm" aria-hidden="true">
        <svg viewBox="0 0 92 92" focusable="false">
          <defs>
            <linearGradient id="persistent-tonearm-metal" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f4f5f5"/>
              <stop offset="0.52" stop-color="#8f99a5"/>
              <stop offset="1" stop-color="#d3b86f"/>
            </linearGradient>
            <radialGradient id="persistent-tonearm-gold" cx="34%" cy="27%" r="80%">
              <stop offset="0" stop-color="#f3d996"/>
              <stop offset="0.6" stop-color="#b88635"/>
              <stop offset="1" stop-color="#5c3d19"/>
            </radialGradient>
          </defs>
          <circle class="persistent-player-tonearm-base" cx="76" cy="16" r="11"/>
          <circle class="persistent-player-tonearm-pivot" cx="76" cy="16" r="7" fill="url(#persistent-tonearm-gold)"/>
          <circle class="persistent-player-tonearm-cap" cx="74" cy="14" r="2.1"/>
          <path class="persistent-player-tonearm-counterweight" d="M80 13 L87 8"/>
          <circle class="persistent-player-tonearm-counterweight-cap" cx="88" cy="7" r="3.2"/>
          <path class="persistent-player-tonearm-shadow" d="M72 22 C70 24 68 27 66 30 L62 36"/>
          <path class="persistent-player-tonearm-arm" d="M72 22 C70 24 68 27 66 30 L62 36" stroke="url(#persistent-tonearm-metal)"/>
          <g class="persistent-player-tonearm-cartridge" transform="translate(61 36) rotate(-48)">
            <rect x="-5" y="-3.5" width="12" height="7" rx="2"/>
            <path d="M-2.5 3.5 L-4 7.5"/>
          </g>
        </svg>
      </span>
    </div>

    <span class="persistent-player-live" data-persistent-status aria-live="polite"></span>
  </aside>

  <noscript>本站的连续播放与页面导航需要启用 JavaScript。</noscript>
  <script src="/js/site-shell.js?v=20260814-minimized-dock-1&bootstrap=20260818-html-revision-1"></script>
  <script src="/js/site-shell-vinyl-hit.js?v=20260814-vinyl-chassis-3"></script>
</body>
</html>
